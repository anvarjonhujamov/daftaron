openapi: 3.0.3
info:
  title: Daftaron API
  version: 1.0.0
  description: |
    Daftaron ERP/CRM tenant API.
    Autentifikatsiya Web va API uchun bir xil: login (telefon + parol; SMS o'chirilganda darhol token), ro'yxatdan o'tish 2 bosqich (1) ism + telefon → (2) verify 1234 → (3) register/complete do'kon + parol. Ma'lumotlar to'liq kiritilguncha bazaga yozilmaydi, 30 daqiqa cache.

    Click to'lov integratsiyasi:
    - Web ilova balans va obuna uchun Click'ga redirect qiladi (`https://my.click.uz/services/pay`), transaction_param sifatida `payment_orders.id` yuboriladi.
    - Ta'rif to'lovi (Web): POST /subscription/plan-pay/{plan} — backend PaymentOrder (type=subscription, plan_id, amount=plan narxi) yaratadi va Click ga redirect qiladi. Complete callback da order type=subscription bo'lsa ta'rif avtomatik faollashadi (trial_ends_at yangilanadi, PlanPurchase yoziladi, tenant.plan_id yangilanadi).
    - Click callback endpointlari (authsiz, JSON javob): `POST /payment/click/prepare` va `POST /payment/click/complete`.
    - `merchant_trans_id` qiymati:
      - ilovadan redirect qilinganda — bu `payment_orders.id` bo'lishi kerak;
      - Click ilovasining o'zidan to'lov qilganda — foydalanuvchi public ID si (`id + 1000`, masalan 1001) yoki telefoni (`+998XXXXXXXXX` yoki `998XXXXXXXXX`) bo'lishi mumkin.
    - Complete da: order type=balance_deposit bo'lsa summa user balansiga qo'shiladi; order type=subscription va plan_id bor bo'lsa ta'rif avtomatik sotib olinadi (qo'lda yana tanlash shart emas).
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Dashboard
  - name: Customers
  - name: Debts
  - name: Payments
  - name: Subscription
  - name: Profile
  - name: Notifications
  - name: Locations
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  parameters:
    AcceptJson:
      name: Accept
      in: header
      required: true
      description: Always set to application/json
      schema:
        type: string
        example: application/json
    ContentTypeJson:
      name: Content-Type
      in: header
      required: true
      description: Send JSON request bodies
      schema:
        type: string
        example: application/json
  schemas:
    Plan:
      type: object
      description: "Obuna ta'rifi (nasiya to'plami). Hozircha faqat Oddiy (MVP)."
      properties:
        id:
          type: integer
          description: Plan ID
        name:
          type: string
          description: "Ta'rif nomi (masalan, Oddiy)"
        price:
          type: number
          description: "Oylik abonent to'lovi (so'm)"
        description:
          type: string
          nullable: true
          description: "HTML tavsif (chegirmalar va imkoniyatlar ro'yxati)"
        debt_limit:
          type: integer
          nullable: true
          description: "Umumiy nasiyalar soni limiti. null bo'lsa cheklanmagan."
        sms_limit:
          type: integer
          nullable: true
          description: "Oyiga bepul SMS soni. null bo'lsa cheklanmagan."
    User:
      type: object
      description: Authenticated user
      properties:
        id: { type: integer, description: Internal user ID (bazadagi id) }
        public_id:
          type: integer
          description: "Foydalanuvchi uchun ko'rinadigan ID (profil va Click uchun) — `id + 1000`, masalan id=1 → public_id=1001"
        name: { type: string, description: Full name }
        phone: { type: string, description: Phone number in international format }
        email: { type: string, nullable: true, description: Optional email }
        tenant_id: { type: integer, nullable: true, description: Tenant/organization ID }
        status:
          type: integer
          description: "Account status: 1=active, 0=inactive"
        trial_ends_at:
          type: string
          nullable: true
          format: date-time
          description: Trial end datetime (nullable)
    CustomerListItem:
      type: object
      description: Customer list item with location names and total debt
      properties:
        id: { type: integer, description: Customer ID }
        tenant_id: { type: integer, description: Tenant ID }
        manager_id: { type: integer, nullable: true, description: Manager user ID }
        region_id: { type: integer, nullable: true, description: Region ID }
        district_id: { type: integer, nullable: true, description: District ID }
        street_id: { type: integer, nullable: true, description: Street ID }
        name: { type: string, description: Customer name }
        phone: { type: string, description: Customer phone number }
        address: { type: string, nullable: true, description: Full address text }
        note: { type: string, nullable: true, description: Internal note }
        total_debt:
          type: number
          description: Sum of remaining_amount across all debts
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        region: { type: string, nullable: true, description: Region name }
        district: { type: string, nullable: true, description: District name }
        street: { type: string, nullable: true, description: Street name }
    Customer:
      type: object
      description: Customer create/update payload
      properties:
        id: { type: integer, description: Customer ID }
        tenant_id: { type: integer, description: Tenant ID }
        manager_id: { type: integer, nullable: true, description: Manager user ID }
        region_id: { type: integer, nullable: true, description: Region ID }
        district_id: { type: integer, nullable: true, description: District ID }
        street_id: { type: integer, nullable: true, description: Street ID }
        name: { type: string, description: Customer name }
        phone: { type: string, description: Customer phone number }
        address: { type: string, nullable: true, description: Full address text }
        note: { type: string, nullable: true, description: Internal note }
    Debt:
      type: object
      description: Debt (nasiya) record
      properties:
        id: { type: integer, description: Debt ID }
        customer_id: { type: integer, description: Related customer ID }
        debt_date:
          type: string
          format: date
          description: "Nasiya sanasi (YYYY-MM-DD). Tanlanmasa bugungi sana. Oxirgi 1 oy oralig'ida bo'lishi kerak."
        total_amount: { type: number, description: Total debt amount }
        remaining_amount: { type: number, description: Remaining unpaid amount }
        status:
          type: string
          description: "Debt status: open or closed"
          enum: [open, closed]
        description: { type: string, nullable: true, description: Optional note }
        sms_sent:
          type: boolean
          description: "true bo'lsa, bu nasiya yaratilganda mijozga SMS yuborilgan (debt SMS xabarnomasi)."
    Payment:
      type: object
      description: Payment for a debt
      properties:
        id: { type: integer, description: Payment ID }
        debt_id: { type: integer, description: Related debt ID }
        amount: { type: number, description: Payment amount }
        paid_at: { type: string, format: date-time, description: Payment datetime }
    PaginationLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }
    PaginationMetaLink:
      type: object
      properties:
        url: { type: string, nullable: true }
        label: { type: string }
        active: { type: boolean }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        path: { type: string }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }
        links:
          type: array
          items: { $ref: "#/components/schemas/PaginationMetaLink" }
    PaginatedCustomers:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CustomerListItem" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    PaginatedDebts:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Debt" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    PaginatedPayments:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    Notification:
      type: object
      description: Foydalanuvchi bildirishnomasi (database). Nasiya, to'lov, balans to'ldirish va obuna sotib olish amallarida yuboriladi.
      properties:
        id: { type: string, description: Bildirishnoma UUID }
        type: { type: string, description: PHP notification class nomi }
        data:
          type: object
          description: "Payload. type bo'yicha: debt_created (yangi nasiya), debt_payment (nasiyaga to'lov), balance_topped_up (balans to'ldirildi), subscription_purchased (obuna sotib olindi). Umumiy maydonlar: message (matn), type (ichki tur). debt_created/debt_payment: tenant_id, tenant_name, debt_id, customer_name, amount. balance_topped_up: amount, source (click|payme|admin). subscription_purchased: plan_id, plan_name, amount."
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    PaginatedNotifications:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    Region:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    District:
      type: object
      properties:
        id: { type: integer }
        region_id: { type: integer }
        name: { type: string }
    Street:
      type: object
      properties:
        id: { type: integer }
        district_id: { type: integer }
        name: { type: string }
    Category:
      type: object
      description: Do'kon kategoriyasi (ro'yxatdan o'tish va do'kon qo'shishda tanlanadi)
      properties:
        id: { type: integer }
        name: { type: string }
paths:
  /auth/login:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      summary: Login
      description: |
        Telefon raqam va parolni yuboradi.
        - SMS tasdiqlash yoqilgan bo'lsa (SMS_VERIFICATION_ENABLED=true): SMS orqali 4 xonali kod yuboriladi, keyin `/auth/verify` (type=login) orqali tasdiqlab token olasiz.
        - SMS tasdiqlash o'chirilgan bo'lsa: darhol token qaytariladi (Web va API bir xil).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                  description: "Telefon raqam (+998 majburiy, bazada +998XXXXXXXXX saqlanadi)"
                  example: "+998901234567"
                password:
                  type: string
                  description: Parol
                device_name:
                  type: string
                  description: Qurilma nomi (ixtiyoriy)
                  example: "mobile"
      responses:
        "200":
          description: |
            SMS o'chirilganda: token va user.
            SMS yoqilganda: requires_verification true, keyin /auth/verify (type=login) orqali token oling.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string, description: Sanctum bearer token (SMS o'chirilganda) }
                  user: { $ref: "#/components/schemas/User" }
                  phone: { type: string }
                  requires_verification: { type: boolean, description: true bo'lsa /auth/verify kerak }
        "422":
          description: Validation error
        "500":
          description: SMS yuborishda xatolik (SMS yoqilganda)
  /auth/register:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      summary: Ro'yxatdan o'tish — 1-bosqich (ism + telefon)
      description: |
        Web va API bir xil: avval faqat ism va telefon raqamini yuboring. Ma'lumotlar bazaga yozilmaydi, 30 daqiqa cache da saqlanadi.
        Keyin `/auth/verify` (type=register, code=1234 — hozircha standart kod) orqali tasdiqlang.
        Tasdiqlagach, ro'yxatni to'ldirish uchun `/auth/register/complete` ga do'kon ma'lumotlarini yuboring; shundan keyin user yaratiladi va token qaytariladi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name:
                  type: string
                  description: Foydalanuvchi ismi
                  example: "Xurshidbek Muminov"
                phone:
                  type: string
                  description: "Telefon raqam (+998 majburiy, unique, bazada +998XXXXXXXXX saqlanadi)"
                  example: "+998901234567"
                device_name:
                  type: string
                  description: Qurilma nomi (ixtiyoriy, token uchun)
                  example: "mobile"
      responses:
        "200":
          description: Tasdiqlash kerak (30 daqiqa cache)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  phone: { type: string }
                  requires_verification: { type: boolean, example: true }
        "422":
          description: Validation error (masalan telefon allaqachon band)
        "500":
          description: SMS yuborishda xatolik (SMS yoqilganda)
  /auth/telegram-login:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      summary: Telegram orqali tezkor login (API)
      description: |
        Telegram bot orqali yuborilgan telefon raqami bo'yicha foydalanuvchini tezkor autentifikatsiya qiladi.

        - Foydalanuvchi bazada bo'lsa — darhol token va user qaytaradi.
        - Bo'lmasa — 404 va `requires_registration=true` qaytaradi (avval web orqali ro'yxatdan o'tishi kerak).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: "Telegram'dan olingan telefon raqam (+998 yoki 998 bilan). Bazada +998 formatida saqlanadi."
                  example: "+998901234567"
                device_name:
                  type: string
                  description: "Qurilma nomi (standart: telegram)"
                  example: "telegram"
      responses:
        "200":
          description: Foydalanuvchi topildi, token qaytarildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "404":
          description: Foydalanuvchi topilmadi (ro'yxatdan o'tmagan)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  requires_registration:
                    type: boolean
                    example: true
  /auth/verify:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      summary: SMS kodini tasdiqlash
      description: |
        Login yoki Register 1-bosqichidan keyin 4 xonali kodni tasdiqlash. Hozircha standart kod 1234 (Eskiz tasdiqlanishigacha).
        - type=login: kod to'g'ri bo'lsa token va user qaytariladi.
        - type=register: kod to'g'ri bo'lsa user yaratilmaydi; requires_completion true qaytadi, keyin `/auth/register/complete` ga so'rov yuborish kerak.
        Cache 30 daqiqa (register), 10 daqiqa (login).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, type]
              properties:
                phone:
                  type: string
                  description: "Telefon raqam (+998 majburiy, bazada +998XXXXXXXXX saqlanadi)"
                  example: "+998901234567"
                code:
                  type: string
                  description: 4 xonali tasdiqlash kodi (standart 1234)
                  example: "1234"
                  minLength: 4
                  maxLength: 4
                type:
                  type: string
                  description: "login — kirish; register — ro'yxatdan o'tish"
                  enum: [login, register]
      responses:
        "200":
          description: |
            type=login: token va user.
            type=register: requires_completion true, phone; keyin /auth/register/complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
                  phone: { type: string }
                  requires_completion: { type: boolean, description: "true bo'lsa register/complete kerak" }
        "404":
          description: Cache muddati tugagan yoki ma'lumot topilmadi
        "422":
          description: Tasdiqlash kodi noto'g'ri
  /auth/password/forgot:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      summary: Parolni tiklash — 1-bosqich (telefon)
      description: |
        Telefon raqami bo'yicha parolni tiklashni boshlaydi. Raqam tizimda bo'lsa, SMS orqali 4 xonali kod yuboriladi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: "Telefon raqam (+998 yoki 998 bilan). Bazada +998 formatida saqlanadi."
                  example: "+998901234567"
      responses:
        "200":
          description: SMS yuborildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  phone: { type: string }
        "404":
          description: Telefon raqami tizimda topilmadi
        "500":
          description: SMS yuborishda xatolik
  /auth/password/verify:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      summary: Parolni tiklash — 2-bosqich (SMS kod)
      description: |
        SMS orqali yuborilgan 4 xonali kodni tasdiqlaydi va parolni yangilash uchun `reset_token` qaytaradi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                  description: "Telefon raqam (+998 yoki 998 bilan)."
                  example: "+998901234567"
                code:
                  type: string
                  description: "4 xonali tasdiqlash kodi"
                  example: "1234"
                  minLength: 4
                  maxLength: 4
      responses:
        "200":
          description: Kod tasdiqlandi, reset_token berildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  reset_token: { type: string }
        "422":
          description: Tasdiqlash kodi noto'g'ri yoki muddati tugagan
  /auth/password/reset:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      summary: Parolni tiklash — 3-bosqich (yangi parol)
      description: |
        `reset_token` va yangi parolni qabul qiladi; token bo'yicha user telefon raqami aniqlanadi va parol yangilanadi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, password, password_confirmation]
              properties:
                reset_token:
                  type: string
                  description: "2-bosqichda olingan token (10 daqiqa amal qiladi)"
                password:
                  type: string
                  description: "Yangi parol (min 6 belgi)"
                  minLength: 6
                password_confirmation:
                  type: string
                  description: "Parolni tasdiqlash (password bilan bir xil bo'lishi kerak)"
      responses:
        "200":
          description: Parol muvaffaqiyatli yangilandi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "422":
          description: Reset token noto'g'ri yoki muddati tugagan, yoki parol validatsiyasi xato
        "404":
          description: Foydalanuvchi topilmadi
  /auth/register/complete:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      summary: Ro'yxatdan o'tish — 2-bosqich (do'kon + parol)
      description: |
        SMS tasdiqlangach (verify type=register) shu endpoint ga telefon va qolgan ma'lumotlarni yuboring. Ma'lumotlar to'liq kiritilgach bazaga yoziladi, token qaytariladi.
        Telefon 30 daqiqa ichida cache da bo'lishi kerak (register + verify qilingan).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, shop_name, category_id, region_id, district_id, street_id, password, password_confirmation]
              properties:
                phone:
                  type: string
                  description: "Tasdiqlangan telefon (+998 formatida, cache kaliti)"
                  example: "+998901234567"
                shop_name:
                  type: string
                  description: Do'kon nomi
                  example: "Mebel Do'koni"
                category_id:
                  type: integer
                  description: "Do'kon kategoriyasi ID (GET /locations/categories dan)"
                  example: 1
                region_id:
                  type: integer
                  description: Viloyat ID (locations/regions dan)
                  example: 1
                district_id:
                  type: integer
                  description: Tuman ID (locations/districts/{regionId})
                  example: 5
                street_id:
                  type: integer
                  description: Ko'cha ID (locations/streets/{districtId})
                  example: 10
                password:
                  type: string
                  description: Parol (min 6 belgi)
                  example: "password123"
                password_confirmation:
                  type: string
                  example: "password123"
      responses:
        "201":
          description: User va tenant yaratildi, token qaytariladi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "404":
          description: Cache muddati tugagan yoki ma'lumot topilmadi
        "422":
          description: Validation error
  /auth/me:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Current user
      responses:
        "200":
          description: User object
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
  /auth/logout:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Revoke token
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /dashboard:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Dashboard]
      security: [{ bearerAuth: [] }]
      summary: Tenant dashboard stats
      responses:
        "200":
          description: Stats payload
  /customers:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      summary: List customers
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200":
          description: Paginated customers
          content:
            application/json:
              schema:
