openapi: 3.0.3
info:
  title: Daftaron API
  version: 1.0.0
  description: |
    Daftaron ERP/CRM tenant API.
    Autentifikatsiya Web va API uchun bir xil: login (telefon + parol; SMS o'chirilganda darhol token), ro'yxatdan o'tish 2 bosqich (1) ism + telefon → (2) verify 1234 → (3) register/complete do'kon + parol. Ma'lumotlar to'liq kiritilguncha bazaga yozilmaydi, 30 daqiqa cache.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Dashboard
  - name: Customers
  - name: Debts
  - name: Payments
  - name: Profile
  - name: Notifications
  - name: Locations
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  parameters:
    AcceptJson:
      name: Accept
      in: header
      required: true
      description: Always set to application/json
      schema:
        type: string
        example: application/json
    ContentTypeJson:
      name: Content-Type
      in: header
      required: true
      description: Send JSON request bodies
      schema:
        type: string
        example: application/json
  schemas:
    User:
      type: object
      description: Authenticated user
      properties:
        id: { type: integer, description: User ID }
        name: { type: string, description: Full name }
        phone: { type: string, description: Phone number in international format }
        email: { type: string, nullable: true, description: Optional email }
        tenant_id: { type: integer, nullable: true, description: Tenant/organization ID }
        status:
          type: integer
          description: "Account status: 1=active, 0=inactive"
        trial_ends_at:
          type: string
          nullable: true
          format: date-time
          description: Trial end datetime (nullable)
    CustomerListItem:
      type: object
      description: Customer list item with location names and total debt
      properties:
        id: { type: integer, description: Customer ID }
        tenant_id: { type: integer, description: Tenant ID }
        manager_id: { type: integer, nullable: true, description: Manager user ID }
        region_id: { type: integer, nullable: true, description: Region ID }
        district_id: { type: integer, nullable: true, description: District ID }
        street_id: { type: integer, nullable: true, description: Street ID }
        name: { type: string, description: Customer name }
        phone: { type: string, description: Customer phone number }
        address: { type: string, nullable: true, description: Full address text }
        note: { type: string, nullable: true, description: Internal note }
        total_debt:
          type: number
          description: Sum of remaining_amount across all debts
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        region: { type: string, nullable: true, description: Region name }
        district: { type: string, nullable: true, description: District name }
        street: { type: string, nullable: true, description: Street name }
    Customer:
      type: object
      description: Customer create/update payload
      properties:
        id: { type: integer, description: Customer ID }
        tenant_id: { type: integer, description: Tenant ID }
        manager_id: { type: integer, nullable: true, description: Manager user ID }
        region_id: { type: integer, nullable: true, description: Region ID }
        district_id: { type: integer, nullable: true, description: District ID }
        street_id: { type: integer, nullable: true, description: Street ID }
        name: { type: string, description: Customer name }
        phone: { type: string, description: Customer phone number }
        address: { type: string, nullable: true, description: Full address text }
        note: { type: string, nullable: true, description: Internal note }
    Debt:
      type: object
      description: Debt (nasiya) record
      properties:
        id: { type: integer, description: Debt ID }
        customer_id: { type: integer, description: Related customer ID }
        total_amount: { type: number, description: Total debt amount }
        remaining_amount: { type: number, description: Remaining unpaid amount }
        status:
          type: string
          description: "Debt status: open or closed"
          enum: [open, closed]
        description: { type: string, nullable: true, description: Optional note }
    Payment:
      type: object
      description: Payment for a debt
      properties:
        id: { type: integer, description: Payment ID }
        debt_id: { type: integer, description: Related debt ID }
        amount: { type: number, description: Payment amount }
        paid_at: { type: string, format: date-time, description: Payment datetime }
    PaginationLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }
    PaginationMetaLink:
      type: object
      properties:
        url: { type: string, nullable: true }
        label: { type: string }
        active: { type: boolean }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        path: { type: string }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }
        links:
          type: array
          items: { $ref: "#/components/schemas/PaginationMetaLink" }
    PaginatedCustomers:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CustomerListItem" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    PaginatedDebts:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Debt" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    PaginatedPayments:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    Notification:
      type: object
      description: User notification
      properties:
        id: { type: string, description: Notification UUID }
        type: { type: string, description: Notification class/type }
        data: { type: object, description: Notification payload }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    PaginatedNotifications:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        links: { $ref: "#/components/schemas/PaginationLinks" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }
    Region:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    District:
      type: object
      properties:
        id: { type: integer }
        region_id: { type: integer }
        name: { type: string }
    Street:
      type: object
      properties:
        id: { type: integer }
        district_id: { type: integer }
        name: { type: string }
paths:
  /auth/login:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      summary: Login
      description: |
        Telefon raqam va parolni yuboradi.
        - SMS tasdiqlash yoqilgan bo'lsa (SMS_VERIFICATION_ENABLED=true): SMS orqali 4 xonali kod yuboriladi, keyin `/auth/verify` (type=login) orqali tasdiqlab token olasiz.
        - SMS tasdiqlash o'chirilgan bo'lsa: darhol token qaytariladi (Web va API bir xil).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                  description: "Telefon raqam (+998 majburiy, bazada +998XXXXXXXXX saqlanadi)"
                  example: "+998901234567"
                password:
                  type: string
                  description: Parol
                device_name:
                  type: string
                  description: Qurilma nomi (ixtiyoriy)
                  example: "mobile"
      responses:
        "200":
          description: |
            SMS o'chirilganda: token va user.
            SMS yoqilganda: requires_verification true, keyin /auth/verify (type=login) orqali token oling.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string, description: Sanctum bearer token (SMS o'chirilganda) }
                  user: { $ref: "#/components/schemas/User" }
                  phone: { type: string }
                  requires_verification: { type: boolean, description: true bo'lsa /auth/verify kerak }
        "422":
          description: Validation error
        "500":
          description: SMS yuborishda xatolik (SMS yoqilganda)
  /auth/register:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      summary: Ro'yxatdan o'tish — 1-bosqich (ism + telefon)
      description: |
        Web va API bir xil: avval faqat ism va telefon raqamini yuboring. Ma'lumotlar bazaga yozilmaydi, 30 daqiqa cache da saqlanadi.
        Keyin `/auth/verify` (type=register, code=1234 — hozircha standart kod) orqali tasdiqlang.
        Tasdiqlagach, ro'yxatni to'ldirish uchun `/auth/register/complete` ga do'kon ma'lumotlarini yuboring; shundan keyin user yaratiladi va token qaytariladi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name:
                  type: string
                  description: Foydalanuvchi ismi
                  example: "Xurshidbek Muminov"
                phone:
                  type: string
                  description: "Telefon raqam (+998 majburiy, unique, bazada +998XXXXXXXXX saqlanadi)"
                  example: "+998901234567"
                device_name:
                  type: string
                  description: Qurilma nomi (ixtiyoriy, token uchun)
                  example: "mobile"
      responses:
        "200":
          description: Tasdiqlash kerak (30 daqiqa cache)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  phone: { type: string }
                  requires_verification: { type: boolean, example: true }
        "422":
          description: Validation error (masalan telefon allaqachon band)
        "500":
          description: SMS yuborishda xatolik (SMS yoqilganda)
  /auth/verify:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      summary: SMS kodini tasdiqlash
      description: |
        Login yoki Register 1-bosqichidan keyin 4 xonali kodni tasdiqlash. Hozircha standart kod 1234 (Eskiz tasdiqlanishigacha).
        - type=login: kod to'g'ri bo'lsa token va user qaytariladi.
        - type=register: kod to'g'ri bo'lsa user yaratilmaydi; requires_completion true qaytadi, keyin `/auth/register/complete` ga so'rov yuborish kerak.
        Cache 30 daqiqa (register), 10 daqiqa (login).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, type]
              properties:
                phone:
                  type: string
                  description: "Telefon raqam (+998 majburiy, bazada +998XXXXXXXXX saqlanadi)"
                  example: "+998901234567"
                code:
                  type: string
                  description: 4 xonali tasdiqlash kodi (standart 1234)
                  example: "1234"
                  minLength: 4
                  maxLength: 4
                type:
                  type: string
                  description: "login — kirish; register — ro'yxatdan o'tish"
                  enum: [login, register]
      responses:
        "200":
          description: |
            type=login: token va user.
            type=register: requires_completion true, phone; keyin /auth/register/complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
                  phone: { type: string }
                  requires_completion: { type: boolean, description: "true bo'lsa register/complete kerak" }
        "404":
          description: Cache muddati tugagan yoki ma'lumot topilmadi
        "422":
          description: Tasdiqlash kodi noto'g'ri
  /auth/register/complete:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      summary: Ro'yxatdan o'tish — 2-bosqich (do'kon + parol)
      description: |
        SMS tasdiqlangach (verify type=register) shu endpoint ga telefon va qolgan ma'lumotlarni yuboring. Ma'lumotlar to'liq kiritilgach bazaga yoziladi, token qaytariladi.
        Telefon 30 daqiqa ichida cache da bo'lishi kerak (register + verify qilingan).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, shop_name, category_id, region_id, district_id, street_id, password, password_confirmation]
              properties:
                phone:
                  type: string
                  description: "Tasdiqlangan telefon (+998 formatida, cache kaliti)"
                  example: "+998901234567"
                shop_name:
                  type: string
                  description: Do'kon nomi
                  example: "Mebel Do'koni"
                category_id:
                  type: integer
                  description: Faoliyat turi (kategoriya) ID
                  example: 1
                region_id:
                  type: integer
                  description: Viloyat ID (locations/regions dan)
                  example: 1
                district_id:
                  type: integer
                  description: Tuman ID (locations/districts/{regionId})
                  example: 5
                street_id:
                  type: integer
                  description: Ko'cha ID (locations/streets/{districtId})
                  example: 10
                password:
                  type: string
                  description: Parol (min 6 belgi)
                  example: "password123"
                password_confirmation:
                  type: string
                  example: "password123"
      responses:
        "201":
          description: User va tenant yaratildi, token qaytariladi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "404":
          description: Cache muddati tugagan yoki ma'lumot topilmadi
        "422":
          description: Validation error
  /auth/me:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Current user
      responses:
        "200":
          description: User object
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
  /auth/logout:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Revoke token
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /dashboard:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Dashboard]
      security: [{ bearerAuth: [] }]
      summary: Tenant dashboard stats
      responses:
        "200":
          description: Stats payload
  /customers:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      summary: List customers
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        "200":
          description: Paginated customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCustomers"
    post:
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Customer"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /customers/{id}:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      summary: Customer detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    put:
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      summary: Update customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      tags: [Customers]
      security: [{ bearerAuth: [] }]
      summary: Delete customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /debts:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Debts]
      security: [{ bearerAuth: [] }]
      summary: List debts
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, closed]
          description: Filter by status
      responses:
        "200":
          description: Paginated debts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDebts"
    post:
      tags: [Debts]
      security: [{ bearerAuth: [] }]
      summary: Create debt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, total_amount]
              properties:
                customer_id: { type: integer, description: Customer ID }
                total_amount: { type: number, description: Total debt amount }
                description: { type: string, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"
  /debts/{id}:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Debts]
      security: [{ bearerAuth: [] }]
      summary: Debt detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Debt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"
    put:
      tags: [Debts]
      security: [{ bearerAuth: [] }]
      summary: Update debt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"
    delete:
      tags: [Debts]
      security: [{ bearerAuth: [] }]
      summary: Delete debt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /debts/{id}/close:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    patch:
      tags: [Debts]
      security: [{ bearerAuth: [] }]
      summary: Close debt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /payments:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      summary: List payments
      parameters:
        - in: query
          name: debt_id
          schema: { type: integer }
          description: Filter by debt ID
      responses:
        "200":
          description: Paginated payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPayments"
    post:
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      summary: Create payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [debt_id, amount]
              properties:
                debt_id: { type: integer, description: Debt ID }
                amount: { type: number, description: Payment amount }
                paid_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Optional payment datetime
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /profile:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Profile
      responses:
        "200":
          description: User + tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
    put:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: { type: string }
                phone: { type: string }
                email: { type: string, nullable: true }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
  /profile/password:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    put:
      tags: [Profile]
      security: [{ bearerAuth: [] }]
      summary: Update password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /notifications:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: List notifications
      responses:
        "200":
          description: Paginated notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedNotifications"
  /notifications/{id}:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: Notification detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /locations/regions:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Locations]
      summary: Regions
      responses:
        "200":
          description: List regions
          content:
            application/json:
              schema:
                type: array
