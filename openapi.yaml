  /debts/overdue:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Debts]
      security: [{ bearerAuth: [] }]
      summary: Muddati o'tgan qarzdorlar (har bir mijoz bo'yicha)
      description: |
        Har bir mijoz uchun muddati o'tgan ochiq nasiyalarni agregatsiya qiladi:

        - `total_remaining` — shu mijoz bo'yicha barcha muddati o'tgan nasiyalarning qolgan summasi;
        - `first_debt_date` — birinchi (eng eski) muddati o'tgan nasiya sanasi;
        - `days_overdue` — shu sanadan boshlab bugungacha o'tgan kunlar soni.

        Default bo'yicha faqat **10 kundan** oshgan nasiyalar olinadi va birinchi bo'lib eng uzoq (kuni eng ko'p o'tgan) mijozlar chiqadi.
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 10, minimum: 1, maximum: 365 }
          description: "Necha kundan oshgan nasiyalarni hisoblash (default: 10)."
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
          description: "Tartiblash: asc — eng uzoq birinchi (standart), desc — eng yaqindan."
        - in: query
          name: tenant_id
          schema: { type: integer }
          description: "Faqat admin/manager uchun: ma'lum do'kon bo'yicha filter."
      responses:
        "200":
          description: Muddati o'tgan qarzdorlar ro'yxati (har bir mijoz uchun bitta satr)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    customer_id: { type: integer, description: Mijoz ID si }
                    name: { type: string, description: Mijoz ismi }
                    phone: { type: string, description: Mijoz telefoni }
                    first_debt_date:
                      type: string
                      format: date
                      description: "Muddati o'tgan birinchi nasiya sanasi"
                    days_overdue:
                      type: integer
                      description: "Necha kundan beri qarzdor (first_debt_date dan boshlab bugungacha)."
                    total_remaining:
                      type: number
                      description: "Muddati o'tgan barcha nasiyalarning umumiy qolgan summasi"
                    overdue_sms_count:
                      type: integer
                      description: "Ushbu mijozga muddati o'tgan qarzdorlik bo'yicha nechta eslatma SMS yuborilgan (faqat hozirgi tenant uchun hisoblanadi)."
                    overdue_sms_last_sent_at:
                      type: string
                      format: date-time
                      nullable: true
                      description: "Oxirgi eslatma SMS yuborilgan sana-vaqt (UTC)."
  /payments:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Payments]
      security: [{ bearerAuth: [] }]
