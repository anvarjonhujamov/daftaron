                paid_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Optional payment datetime
                send_sms:
                  type: boolean
                  nullable: true
                  description: "true bo'lsa, to'lov qabul qilinganda mijozga SMS yuboriladi (ixtiyoriy)."
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /subscription/status:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Subscription]
      security: [{ bearerAuth: [] }]
      summary: Subscription status, balance and recent transactions
      description: |
        Foydalanuvchining balansini, trial ma'lumotlarini, mavjud tariflarni va oxirgi 10 ta tranzaksiyasini qaytaradi.
        Web'dagi obuna sahifasi bilan bir xil mantiq.
      responses:
        "200":
          description: Subscription status payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
                    format: float
                    description: Foydalanuvchi balansi
                  trial_info:
                    type: object
                    properties:
                      trial_ends_at: { type: string, format: date-time, nullable: true }
                      days_remaining: { type: integer }
                      is_expired: { type: boolean }
                      status: { type: integer, description: "1=faol, 0=bloklangan/yakunlangan" }
                  current_plan_id:
                    type: integer
                    nullable: true
                    description: "Hozirgi faol ta'rif ID si (tenant.plan_id); obuna yo'q bo'lsa null."
                  plans:
                    type: array
                    description: "Mavjud tariflar (hozircha faqat Oddiy nasiya to'plami). Har bir ta'rifda nasiya limitlari va bepul SMS limiti bo'lishi mumkin."
                    items:
                      $ref: "#/components/schemas/Plan"
                  transactions:
                    type: array
                    description: Oxirgi 10 ta tranzaksiya (balans to'ldirish va obuna to'lovlari)
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        amount: { type: number, description: "Miqdor: balans to'ldirish uchun musbat, obuna uchun manfiy" }
                        type: { type: string, description: "deposit yoki subscription" }
                        status: { type: string }
                        description: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
  /subscription/choose/{plan}:
    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    post:
      tags: [Subscription]
      security: [{ bearerAuth: [] }]
      summary: Tarif tanlash (balansdan yechiladi)
      description: |
        Foydalanuvchi uchun tarifni faollashtiradi. Agar trial davom etayotgan bo'lsa va tarif "Oddiy" bo'lsa, balansdan pul yechilmaydi.
        Boshqa hollarda tarif narxi balansdan yechiladi; mablag' yetarli bo'lmasa 422 "Mablag' yetarli emas" qaytadi.
      parameters:
        - in: path
          name: plan
          required: true
          schema: { type: integer }
          description: Tarif ID si
      responses:
        "200":
          description: Tarif muvaffaqiyatli faollashtirildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  trial_ends_at: { type: string, format: date-time }
                  balance:
                    type: number
                    format: float
                    description: Yangilangan balans
        "422":
          description: Mablag' yetarli emas, trial cheklovi yoki tanlangan ta'rif allaqachon faol
        "500":
          description: Ichki server xatosi
