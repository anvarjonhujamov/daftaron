openapi: 3.0.3
info:
  title: Daftaron API
  description: |
    Daftaron — do'konlar uchun nasiya (qarz) boshqaruv tizimi API.

    **Base URL:** `https://your-domain.com/api/v1`

    **Autentifikatsiya:** Bearer token (Laravel Sanctum).
    Login yoki register/complete dan keyin `token` beriladi.
    So'rovlarda: `Authorization: Bearer <token>`.

    **Multi-tenant:** `customers`, `debts`, `payments` endpointlari uchun:
    - Query/body: `tenant_id`
    - Header: `X-Tenant-Id`

    **So'nggi yangilanish:** 2026-08-05
  version: "1.0.0"
  contact:
    name: Daftaron Support
    email: support@daftaron.uz

servers:
  - url: https://your-domain.com/api/v1
    description: Production server
  - url: http://localhost:8000/api/v1
    description: Local development server

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Login
      description: Telefon raqam va parol bilan kirish
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - password
              properties:
                phone:
                  type: string
                  example: "+998901234567"
                  description: "Telefon raqam (9 xonali yoki +998 bilan)"
                password:
                  type: string
                  example: "password123"
                  description: "Parol"
      responses:
        '200':
          description: Muvaffaqiyatli login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "1|abc123def456"
                    description: "Bearer token"
                  user:
                    $ref: '#/components/schemas/User'
                  requires_verification:
                    type: boolean
                    example: false
                    description: "SMS tasdiqlash kerakmi"
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      summary: Ro'yxatdan o'tish - 1-qadam
      description: Ism va telefon bilan ro'yxatdan o'tish (SMS yuboriladi)
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
              properties:
                name:
                  type: string
                  example: "Ali Valiyev"
                  description: "Foydalanuvchi ismi"
                phone:
                  type: string
                  example: "+998901234567"
                  description: "Telefon raqam"
      responses:
        '200':
          description: SMS yuborildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "SMS kod yuborildi"
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/verify:
    post:
      summary: SMS kodni tasdiqlash
      description: Login yoki register uchun SMS kodni tasdiqlash
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
                - type
              properties:
                phone:
                  type: string
                  example: "+998901234567"
                code:
                  type: string
                  example: "123456"
                  description: "6 xonali SMS kod"
                type:
                  type: string
                  enum: [login, register]
                  example: "register"
      responses:
        '200':
          description: Kod to'g'ri
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "1|abc123def456"
                  user:
                    $ref: '#/components/schemas/User'
                  next_step:
                    type: string
                    enum: [complete_registration, login_success]
                    example: "complete_registration"
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/register/complete:
    post:
      summary: Ro'yxatdan o'tish - 2-qadam
      description: Do'kon ma'lumotlari bilan ro'yxatdan o'tishni yakunlash
      tags:
        - Authentication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shop_name
                - category_id
                - region_id
                - district_id
                - street_id
                - password
              properties:
                shop_name:
                  type: string
                  example: "Ali Do'koni"
                  description: "Do'kon nomi"
                category_id:
                  type: integer
                  example: 1
                  description: "Kategoriya ID"
                region_id:
                  type: integer
                  example: 1
                  description: "Viloyat ID"
                district_id:
                  type: integer
                  example: 137
                  description: "Tuman ID"
                street_id:
                  type: integer
                  example: 1234
                  description: "Ko'cha ID"
                password:
                  type: string
                  example: "password123"
                  description: "Parol"
      responses:
        '200':
          description: Ro'yxatdan o'tish muvaffaqiyatli
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "1|abc123def456"
                  user:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      summary: Joriy foydalanuvchi ma'lumotlari
      description: Token bilan foydalanuvchi ma'lumotlarini olish
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Foydalanuvchi ma'lumotlari
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  active_tenant:
                    $ref: '#/components/schemas/Tenant'
                  available_tenants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard:
    get:
      summary: Dashboard statistikasi
      description: Do'kon uchun asosiy statistika va ma'lumotlar
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: integer
          description: "Tenant ID (ixtiyoriy, agar ko'p do'kon bo'lsa)"
      responses:
        '200':
          description: Dashboard ma'lumotlari
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_customers:
                    type: integer
                    example: 150
                  total_debts:
                    type: integer
                    example: 45
                  total_debt_amount:
                    type: number
                    format: float
                    example: 12500000
                  overdue_debts:
                    type: integer
                    example: 12
                  overdue_amount:
                    type: number
                    format: float
                    example: 3500000
                  today_payments:
                    type: integer
                    example: 8
                  today_payment_amount:
                    type: number
                    format: float
                    example: 1200000
                  recent_debts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Debt'
                  recent_payments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
        '403':
          $ref: '#/components/responses/TrialExpired'

  /customers:
    get:
      summary: Mijozlar ro'yxatini olish
      description: Do'kon mijozlarini ro'yxatini olish
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: integer
          description: "Tenant ID"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: "Sahifa raqami"
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
          description: "Har sahifada nechta"
        - name: search
          in: query
          schema:
            type: string
          description: "Qidiruv so'zi (ism yoki telefon)"
      responses:
        '200':
          description: Mijozlar ro'yxati
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '403':
          $ref: '#/components/responses/TrialExpired'

    post:
      summary: Yangi mijoz qo'shish
      description: Do'konga yangi mijoz qo'shish
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
              properties:
                tenant_id:
                  type: integer
                  description: "Tenant ID"
                name:
                  type: string
                  example: "Valijon Aliyev"
                phone:
                  type: string
                  example: "+998901234567"
                region_id:
                  type: integer
                  example: 1
                district_id:
                  type: integer
                  example: 137
                street_id:
                  type: integer
                  example: 1234
                address:
                  type: string
                  example: "Amir Temur ko'chasi 15"
      responses:
        '201':
          description: Mijoz muvaffaqiyatli qo'shildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: '#/components/schemas/Customer'
        '422':
          $ref: '#/components/responses/ValidationError'

  /customers/{customer}:
    get:
      summary: Mijoz tafsilotlari
      description: Bitta mijoz haqida batafsil ma'lumot
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: path
          required: true
          schema:
            type: integer
          description: "Customer ID"
        - name: tenant_id
          in: query
          schema:
            type: integer
          description: "Tenant ID"
      responses:
        '200':
          description: Mijoz tafsilotlari
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: '#/components/schemas/Customer'
                  debts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Debt'
                  payments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
        '404':
          description: Mijoz topilmadi

    put:
      summary: Mijozni tahrirlash
      description: Mijoz ma'lumotlarini yangilash
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: path
          required: true
          schema:
            type: integer
          description: "Customer ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: integer
                name:
                  type: string
                  example: "Valijon Aliyev"
                phone:
                  type: string
                  example: "+998901234567"
                region_id:
                  type: integer
                district_id:
                  type: integer
                street_id:
                  type: integer
                address:
                  type: string
      responses:
        '200':
          description: Mijoz yangilandi
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: '#/components/schemas/Customer'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      summary: Mijozni o'chirish
      description: Mijozni va uning barcha nasiyalarini o'chirish
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: path
          required: true
          schema:
            type: integer
          description: "Customer ID"
        - name: tenant_id
          in: query
          schema:
            type: integer
          description: "Tenant ID"
      responses:
        '204':
          description: Mijoz o'chirildi
        '404':
          description: Mijoz topilmadi

  /debts:
    get:
      summary: Nasiyalar ro'yxatini olish
      description: Do'kon nasiyalarini ro'yxatini olish
      tags:
        - Debts
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: integer
          description: "Tenant ID"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
        - name: status
          in: query
          schema:
            type: string
            enum: [active, closed, overdue]
          description: "Nasiya holati"
      responses:
        '200':
          description: Nasiyalar ro'yxati
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Debt'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      summary: Yangi nasiya yaratish
      description: Mijoz uchun yangi nasiya yaratish
      tags:
        - Debts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - amount
                - description
              properties:
                tenant_id:
                  type: integer
                  description: "Tenant ID"
                customer_id:
                  type: integer
                  example: 123
                  description: "Mijoz ID"
                amount:
                  type: number
                  format: float
                  example: 500000
                  description: "Nasiya summasi (so'm)"
                description:
                  type: string
                  example: "Telefon uchun nasiya"
                  description: "Nasiya tavsifi"
                due_date:
                  type: string
                  format: date
                  example: "2026-05-01"
                  description: "To'lash muddati"
      responses:
        '201':
          description: Nasiya yaratildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  debt:
                    $ref: '#/components/schemas/Debt'
        '422':
          $ref: '#/components/responses/ValidationError'

  /debts/{debt}/close:
    patch:
      summary: Nasiyani yopish
      description: Nasiyani to'liq to'langan deb belgilash
      tags:
        - Debts
      security:
        - bearerAuth: []
      parameters:
        - name: debt
          in: path
          required: true
          schema:
            type: integer
          description: "Debt ID"
        - name: tenant_id
          in: query
          schema:
            type: integer
          description: "Tenant ID"
      responses:
        '200':
          description: Nasiya yopildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  debt:
                    $ref: '#/components/schemas/Debt'

  /payments:
    get:
      summary: To'lovlar ro'yxatini olish
      description: Do'kon to'lovlarini ro'yxatini olish
      tags:
        - Payments
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: integer
          description: "Tenant ID"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: To'lovlar ro'yxati
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      summary: Yangi to'lov qo'shish
      description: |
        To'lov yaratish — mavjud nasiya (debt_id) bo'yicha yoki mijozga (customer_id) nisbatan bajarilishi mumkin.
        Agar debt_id ko'rsatilsa, to'lov shu nasiyaga bog'lanadi va qolgan summa (remaining_amount) kamayadi; to'lov jami qarzdan katta bo'lsa, qolgan summa manfiy bo'lib mijozning ijobiy balansi hosil bo'ladi.
        Agar debt_id ko'rsatilmasa, customer_id berilishi kerak: tizim mijozga tegishli avtomatik "placeholder" nasiya yozuvi yaratadi va unga to'lovni bog'laydi — bu mijoz uchun ijobiy balansni anglatadi.
      tags:
        - Payments
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                tenant_id:
                  type: integer
                  description: "Tenant ID"
                debt_id:
                  type: integer
                  example: 456
                  description: "Nasiya ID (ixtiyoriy). Agar berilsa, to'lov shu nasiyaga bog'lanadi."
                customer_id:
                  type: integer
                  example: 123
                  description: "Mijoz ID (ixtiyoriy). Agar debt_id berilmasa, customer_id talab qilinadi — tizim mijoz uchun avtomatik nasiya yozuvi yaratadi va to'lovni unga bog'laydi."
                amount:
                  type: number
                  format: float
                  example: 100000
                  description: "To'lov summasi (so'm)"
                description:
                  type: string
                  example: "Birinchi to'lov"
      responses:
        '201':
          description: To'lov qo'shildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    $ref: '#/components/schemas/Payment'
        '422':
          $ref: '#/components/responses/ValidationError'

  /subscription/status:
    get:
      summary: Obuna holati
      description: Foydalanuvchi obuna holatini tekshirish
      tags:
        - Subscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Obuna holati
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_expired:
                    type: boolean
                    example: false
                  plan:
                    $ref: '#/components/schemas/Plan'
                  balance:
                    type: number
                    format: float
                    example: 50000
                  trial_ends_at:
                    type: string
                    format: date-time
                    nullable: true
                    example: "2026-04-30T23:59:59Z"

  /subscription/choose/{plan}:
    post:
      summary: Ta'rif tanlash
      description: Obuna uchun ta'rif tanlash
      tags:
        - Subscription
      security:
        - bearerAuth: []
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            type: integer
          description: "Plan ID"
      responses:
        '200':
          description: Ta'rif tanlandi
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_url:
                    type: string
                    example: "https://click.uz/payment/..."
                    description: "To'lov sahifasiga yo'naltirish URL"

  /profile:
    get:
      summary: Profil ma'lumotlari
      description: Joriy foydalanuvchi profili
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil ma'lumotlari
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'

    put:
      summary: Profilni yangilash
      description: Foydalanuvchi profilini tahrirlash
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Ali Valiyev"
                phone:
                  type: string
                  example: "+998901234567"
      responses:
        '200':
          description: Profil yangilandi
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'

  /public/settings:
    get:
      summary: Umumiy sozlamalar
      description: Public offer, privacy policy va aloqa ma'lumotlari
      tags:
        - Public
      responses:
        '200':
          description: Umumiy sozlamalar
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_offer:
                    type: string
                    example: "Ommaviy taklif matni..."
                  privacy_policy:
                    type: string
                    example: "Maxfiylik siyosati matni..."
                  contact_phone:
                    type: string
                    example: "+998901234567"
                  contact_telegram:
                    type: string
                    example: "@daftaron_support"
                  contact_group:
                    type: string
                    example: "https://t.me/daftaron_group"

  /tenants:
    get:
      summary: Barcha do'konlar
      description: Foydalanuvchiga tegishli va u boshqaradigan barcha do'konlarni olish
      tags:
        - Tenants (Do'konlar)
      responses:
        '200':
          description: Do'konlar ro'yxati
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_tenant_id:
                    type: integer
                    nullable: true
                    example: 1
                  tenants:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        region:
                          type: string
                        district:
                          type: string
                        street:
                          type: string
                        category:
                          type: string
                        plan_id:
                          type: integer
                          nullable: true
                        status:
                          type: string
                        balance:
                          type: number
                        is_active:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Yangi do'kon qo'shish
      description: Yangi do'kon qo'shish. Plan limiti tugasa 422 xatosi qaytadi.
      tags:
        - Tenants (Do'konlar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category_id
                - region_id
                - district_id
              properties:
                name:
                  type: string
                  example: "Savdo Markazi"
                category_id:
                  type: integer
                  example: 1
                region_id:
                  type: integer
                  example: 1
                district_id:
                  type: integer
                  example: 1
                street_id:
                  type: integer
                  nullable: true
                  example: 1
      responses:
        '201':
          description: Do'kon muvaffaqiyatli qo'shildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  tenant:
                    type: object
                  usage:
                    type: object
        '422':
          description: Validatsiya xatosi yoki plan limiti
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  requires_upgrade:
                    type: boolean
                  usage:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tenants/active:
    put:
      summary: Faol do'konni o'zartirish
      description: Joriy foydalanuvchining faol do'konini o'zartirish
      tags:
        - Tenants (Do'konlar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
              properties:
                tenant_id:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Faol do'kon yangilandi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  active_tenant:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
        '403':
          description: Ruxsat yo'q
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tenants/{tenant}:
    patch:
      summary: Do'konni tahrirlash (qisman yangilash)
      description: Do'konning ma'lumotlarini qisman yangilash (nom, kategoriya, hudud va h.k.) — tavsiya etilgan API metodi PATCH
      tags:
        - Tenants (Do'konlar)
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
          description: Do'kon ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Tahrirlangan Do'kon"
                category_id:
                  type: integer
                  example: 2
                region_id:
                  type: integer
                  example: 2
                district_id:
                  type: integer
                  example: 3
                street_id:
                  type: integer
                  nullable: true
                  example: 5
      responses:
        '200':
          description: Do'kon muvaffaqiyatli yangilandi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  tenant:
                    type: object
        '403':
          description: Ruxsat yo'q
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      summary: Do'konni o'chirish
      description: Do'konni va unga tegishli ma'lumotlarni butunlay o'chirish
      tags:
        - Tenants (Do'konlar)
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
          description: Do'kon ID
      responses:
        '200':
          description: Do'kon muvaffaqiyatli o'chirildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  active_tenant_id:
                    type: integer
                    nullable: true
                  tenants:
                    type: array
                    items:
                      type: object
        '403':
          description: Ruxsat yo'q
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Ali Valiyev"
        phone:
          type: string
          example: "+998901234567"
        email:
          type: string
          nullable: true
          example: "ali@example.com"
        role:
          type: string
          enum: [shop_owner, shop_worker, admin, manager]
          example: "shop_owner"
        status:
          type: integer
          example: 1
          description: "1 - faol, 0 - faol emas"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Tenant:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Ali Do'koni"
        category_id:
          type: integer
          example: 1
        region_id:
          type: integer
          example: 1
        district_id:
          type: integer
          example: 137
        street_id:
          type: integer
          example: 1234
        address:
          type: string
          example: "Amir Temur ko'chasi 15"
        created_at:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: integer
          example: 123
        tenant_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Valijon Aliyev"
        phone:
          type: string
          example: "+998901234567"
        region_id:
          type: integer
          example: 1
        district_id:
          type: integer
          example: 137
        street_id:
          type: integer
          example: 1234
        address:
          type: string
          example: "Amir Temur ko'chasi 15"
        total_debt:
          type: number
          format: float
          example: 500000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Debt:
      type: object
      properties:
        id:
          type: integer
          example: 456
        tenant_id:
          type: integer
          example: 1
        customer_id:
          type: integer
          example: 123
        amount:
          type: number
          format: float
          example: 500000
        paid_amount:
          type: number
          format: float
          example: 100000
        remaining_amount:
          type: number
          format: float
          example: 400000
        description:
          type: string
          example: "Telefon uchun nasiya"
        due_date:
          type: string
          format: date
          example: "2026-05-01"
        status:
          type: string
          enum: [active, closed, overdue]
          example: "active"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: integer
          example: 789
        tenant_id:
          type: integer
          example: 1
        debt_id:
          type: integer
          example: 456
        customer_id:
          type: integer
          example: 123
        amount:
          type: number
          format: float
          example: 100000
        description:
          type: string
          example: "Birinchi to'lov"
        created_at:
          type: string
          format: date-time

    Plan:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Basic"
        price:
          type: number
          format: float
          example: 50000
        duration_days:
          type: integer
          example: 30
        features:
          type: array
          items:
            type: string
          example: ["100 mijoz", "Cheksiz nasiya", "SMS bildirishnomalar"]

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 150
        last_page:
          type: integer
          example: 10
        from:
          type: integer
          example: 1
        to:
          type: integer
          example: 15

  responses:
    Unauthorized:
      description: Token noto'g'ri yoki yo'q
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Unauthenticated."

    TrialExpired:
      description: Trial muddati tugagan
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Trial period expired. Please choose a plan."
              error_code:
                type: string
                example: "trial_expired"

    ValidationError:
      description: Validatsiya xatosi
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "The given data was invalid."
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  phone: ["The phone field is required."]
                  password: ["The password must be at least 8 characters."]

