    parameters:
      - $ref: "#/components/parameters/AcceptJson"
      - $ref: "#/components/parameters/ContentTypeJson"
    get:
      tags: [Debts]
      security: [{ bearerAuth: [] }]
      summary: List debts
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, closed]
          description: Filter by status
      responses:
        "200":
          description: Paginated debts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDebts"
    post:
      tags: [Debts]
      security: [{ bearerAuth: [] }]
      summary: Create debt (ixtiyoriy SMS bilan)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, total_amount]
              properties:
                customer_id: { type: integer, description: Customer ID }
                debt_date:
                  type: string
                  format: date
                  description: "Nasiya sanasi (YYYY-MM-DD). Ixtiyoriy; tanlanmasa bugungi sana. Oxirgi 1 oy oralig'ida (min: bugundan 1 oy oldin, max: bugun)."
                total_amount: { type: number, description: Total debt amount }
                description: { type: string, nullable: true }
                send_sms:
                  type: boolean
                  description: |
                    true bo'lsa, nasiya yaratilganda mijozga SMS xabarnomasi yuboriladi.

                    Basic (Oddiy) ta'rifida plan.sms_limit (hozircha 15 ta) bepul nasiya SMS bor;
                    limitdan keyingi har bir SMS uchun 200 so'm user balansidan yechiladi (type=sms tranzaksiya).
      responses:
        "201":
          description: Created (SMS yuborilgan/yuborilmagan holat bilan)
          content:
            application/json:
              schema:
                type: object
                properties:
                  debt:
                    $ref: "#/components/schemas/Debt"
                  sms_sent:
                    type: boolean
                    description: "true bo'lsa, SMS muvaffaqiyatli yuborilgan."
                  sms_info:
                    type: string
                    nullable: true
                    description: "Qo'shimcha ma'lumot (masalan, 'SMS yuborildi (bepul limit doirasida)')."
                  sms_error:
                    type: string
                    nullable: true
                    description: "SMS yuborishda xatolik bo'lsa, xabar matni."
