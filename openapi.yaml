openapi: 3.0.3
info:
  title: Daftaron API
  version: 1.0.0
  description: |
    **Daftaron** — Do'konlar uchun nasiya (qarz) boshqaruv tizimi REST API.
    
    **Base URL:** `/api/v1`
    
    **Tillar:** O'zbek tili, **Valyuta:** UZS (so'm), **Vaqt zonasi:** Asia/Tashkent
    
    ## Multi-tenant arxitekturasi
    
    - **Model:** Shared DB + Shared Schema + `tenant_id` isolation
    - Barcha tenantga bog'liq so'rovlar `tenant_id` selector orqali:
      - Query param: `?tenant_id=5`
      - Body: `{ "tenant_id": 5 }`
      - Header: `X-Tenant-Id: 5`
    - Active tenant: `GET /tenants`, `PUT /tenants/active`, `DELETE /tenants/{tenant}`
    - Shop owner faqat o'z tenantini tanlay oladi
    - Unauthorized tenant: 403 Forbidden
    
    ## Autentifikatsiya
    
    - **Bearer Token** (Laravel Sanctum)
    - Login: `POST /auth/login` (telefon + parol)
    - Register: `POST /auth/register` → `POST /auth/verify` → `POST /auth/register/password` → `POST /auth/register/complete`
    - Telegram: `POST /auth/telegram-login`
    - Parol tiklash: 3 bosqich (`/auth/password/forgot`, `/auth/password/verify`, `/auth/password/reset`)
    - Token format: `Authorization: Bearer <token>`
    
    ## Obuna va balans tizimi
    
    - **Trial:** Ro'yxatdan o'tganda 15 kun (sozlanadi)
    - **Ta'riflar:** Oddiy (29,000 so'm/oy), Pro, Premium
    - **Limit:** Nasiya, SMS, do'kon, xodim
    - **Qo'shimcha paketlar:** Extra nasiya, SMS, do'kon, xodim
    - **Promocodlar:** Manager tomonidan berilib, obuna sotib olishda chegirma
    - **Balans:** Foydalanuvchida saqlanadi, ta'rif va SMS uchun yechiladi
    - **Subscription status endpoint** — trial tugaganda ham ishlaydi (read-only)
    
    ## To'lov tizimlari
    
    - **Click:** Merchant API callback (Prepare → Complete)
      - Redirect: `https://my.click.uz/services/pay?service_id=...&amount=...&transaction_param=...`
      - Callback (authsiz): `POST /payment/click/prepare`, `POST /payment/click/complete`
    - **Payme:** JSON-RPC 2.0 Merchant API (HTTP Basic Auth)
      - Endpoint: `POST /api/payme/merchant`
      - Metodlar: CheckPerformTransaction, CreateTransaction, PerformTransaction, CancelTransaction, CheckTransaction, GetStatement
      - Account field: `user_id` (pending order create)
    
    ## Qo'shimcha linqlar
    
    - **Texnik topshiriq:** [/TZ.md](/TZ.md)
    - **Userflow (Mobil):** [/UserFlow-Mobile.md](/UserFlow-Mobile.md)
    - **OpenAPI spec:** [/public/docs/openapi.yaml](/public/docs/openapi.yaml)

servers:
  - url: /api/v1
    description: Production API

tags:
  - name: Auth
    description: Autentifikatsiya va registratsiya
  - name: Subscription
    description: Obuna va balans tizimi
  - name: Tenants
    description: Do'konlar (multi-tenant)
  - name: Customers
    description: Mijozlar boshqaruvi
  - name: Debts
    description: Nasiyalar va qarzdorlar
  - name: Payments
    description: To'lovlar
  - name: Workers
    description: Xodimlar (do'kon uchun)
  - name: Profile
    description: Foydalanuvchi profili
  - name: Notifications
    description: Bildirishnomalar
  - name: Support
    description: AI SupportBot
  - name: Locations
    description: Joylashuv ma'lumotlari
  - name: Webhooks
    description: Tashqi webhook (to'lov callback)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: "Sanctum Bearer Token. Format: `Authorization: Bearer <token>`"

  parameters:
    TenantId:
      name: tenant_id
      in: query
      required: false
      schema:
        type: integer
      description: "Multi-tenant selector. Biznesga bog'liq endpointlarda qo'llaniladi. Body yoki header da ham bo'lishi mumkin."
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
      description: Varaq raqami (pagination)
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Har bir varaqda necha satr

  schemas:
    User:
      type: object
      description: Authenticated user
      properties:
        id:
          type: integer
          description: Internal user ID
        public_id:
          type: integer
          description: "Ko'rinadigan ID: id + 1000 (masalan 1001)"
        name:
          type: string
          description: Foydalanuvchi ismi
        phone:
          type: string
          description: "Telefon raqam. Format: +998XXXXXXXXX"
        email:
          type: string
          nullable: true
        tenant_id:
          type: integer
          nullable: true
          description: Aktiv do'kon ID
        status:
          type: integer
          description: "1 = faol, 0 = bloklangan"
        trial_ends_at:
          type: string
          format: date-time
          nullable: true
          description: Trial/obuna tugash vaqti (ISO 8601)

    Plan:
      type: object
      description: Obuna ta'rifi
      properties:
        id:
          type: integer
        name:
          type: string
          example: "Oddiy"
        price:
          type: number
          example: 29000
        debt_limit:
          type: integer
          nullable: true
          description: "Nasiya limiti (null = cheksiz)"
        sms_limit:
          type: integer
          nullable: true
        shop_limit:
          type: integer
          nullable: true
        worker_limit:
          type: integer
          nullable: true

    ExtraPackage:
      type: object
      description: Qo'shimcha paket
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [debt, sms, shop, worker]
        quantity:
          type: integer
        price:
          type: number
        is_active:
          type: boolean

    SubscriptionStatus:
      type: object
      description: Obuna va balans holati
      properties:
        balance:
          type: number
          description: Foydalanuvchi balansi (so'm)
        current_plan_id:
          type: integer
          nullable: true
        trial_info:
          type: object
          properties:
            trial_ends_at:
              type: string
              format: date-time
            days_remaining:
              type: integer
            is_expired:
              type: boolean
            status:
              type: integer
        usage:
          type: object
          properties:
            subscription_status:
              type: string
              enum: [active, expired]
            plan_name:
              type: string
            plan_price:
              type: number
            debt_total_limit:
              type: integer
              nullable: true
            debt_used:
              type: integer
            debt_remaining:
              type: integer
              nullable: true
            sms_total_limit:
              type: integer
            sms_used:
              type: integer
            sms_remaining:
              type: integer
            extra_sms_price:
              type: number
            allowed_extra_package_types:
              type: array
              items:
                type: string

    Tenant:
      type: object
      description: Do'kon (tenant)
      properties:
        id:
          type: integer
        name:
          type: string
        region:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        street:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        plan_id:
          type: integer
          nullable: true
        status:
          type: string
        balance:
          type: number
        is_active:
          type: boolean

    Customer:
      type: object
      description: Mijoz
      properties:
        id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        phone:
          type: string
        address:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        total_debt:
          type: number

    Debt:
      type: object
      description: Nasiya
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        customer_name:
          type: string
        total_amount:
          type: number
        remaining_amount:
          type: number
        debt_date:
          type: string
          format: date
        status:
          type: string
          enum: [open, closed]
        description:
          type: string
          nullable: true
        sms_sent:
          type: boolean

    Payment:
      type: object
      description: To'lov
      properties:
        id:
          type: integer
        debt_id:
          type: integer
        customer_name:
          type: string
        amount:
          type: number
        paid_at:
          type: string
          format: date-time

    Worker:
      type: object
      description: Xodim
      properties:
        id:
          type: integer
        public_id:
          type: integer
        tenant_id:
          type: integer
        name:
          type: string
        phone:
          type: string
        status:
          type: integer
        stats:
          type: object
          properties:
            customers_served:
              type: integer
            debts_created:
              type: integer
            payments_received:
              type: number

    Notification:
      type: object
      description: Bildirishnoma
      properties:
        id:
          type: string
        type:
          type: string
          example: "debt_created"
        message:
          type: string
        data:
          type: object
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Region:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    District:
      type: object
      properties:
        id:
          type: integer
        region_id:
          type: integer
        name:
          type: string

    Street:
      type: object
      properties:
        id:
          type: integer
        district_id:
          type: integer
        name:
          type: string

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
        links:
          type: object
        meta:
          type: object

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          nullable: true

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login (telefon + parol)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                  example: "+998901234567"
                password:
                  type: string
                device_name:
                  type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      tags: [Auth]
      summary: "Ro'yxat — 1-bosqich (ism + telefon)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name:
                  type: string
                phone:
                  type: string
                  example: "+998901234567"
                device_name:
                  type: string
                  example: "mobile"
      responses:
        "200":
          description: SMS yuborildi, /auth/verify kerak

  /auth/verify:
    post:
      tags: [Auth]
      summary: SMS kodini tasdiqlash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, type]
              properties:
                phone:
                  type: string
                code:
                  type: string
                  example: "1234"
                type:
                  type: string
                  enum: [login, register]
      responses:
        "200":
          description: "type=register: requires_password_setup true; type=login: token"

  /auth/register/password:
    post:
      tags: [Auth]
      summary: "Ro'yxat — 2-bosqich (parol)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password, password_confirmation]
              properties:
                phone:
                  type: string
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: "Parol saqlanadi, keyin /auth/register/complete kerak"

  /auth/register/complete:
    post:
      tags: [Auth]
      summary: "Ro'yxat — 3-bosqich (do'kon)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, shop_name, category_id, region_id, district_id]
              properties:
                phone:
                  type: string
                shop_name:
                  type: string
                category_id:
                  type: integer
                region_id:
                  type: integer
                district_id:
                  type: integer
                street_id:
                  type: integer
      responses:
        "201":
          description: User yaratildi, token qaytarildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"

  /auth/telegram-login:
    post:
      tags: [Auth]
      summary: Telegram orqali login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                device_name:
                  type: string
      responses:
        "200":
          description: Token va user
        "404":
          description: "Foydalanuvchi topilmadi, requires_registration: true"

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Parol tiklash — bosqich 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        "200":
          description: SMS yuborildi

  /auth/password/verify:
    post:
      tags: [Auth]
      summary: Parol tiklash — bosqich 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: reset_token qaytarildi

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Parol tiklash — bosqich 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, password]
              properties:
                reset_token:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Parol yangilandi

  /auth/logout:
    post:
      tags: [Auth]
      summary: Chiqish
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Muvaffaqiyatli chiqdingiz

  /subscription/status:
    get:
      tags: [Subscription]
      summary: Obuna va balans holati (trial tugaganda ham ishlaydi)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Balans, trial_info, usage, plans, extra_packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"

  /subscription/choose/{planId}:
    post:
      tags: [Subscription]
      summary: Ta'rif tanlash
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                promo_code:
                  type: string
      responses:
        "200":
          description: Ta'rif tanlandi, muddati sotib olingan kundan 30 kun
        "422":
          description: Mablag' yetarli emas

  /subscription/buy-extra/{extraPackageId}:
    post:
      tags: [Subscription]
      summary: Qo'shimcha paket sotib olish
      security:
        - bearerAuth: []
      parameters:
        - name: extraPackageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Paket sotib olingani
        "422":
          description: Xatolik

  /promo-codes/check:
    post:
      tags: [Subscription]
      summary: Promocode tekshirish
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: "valid: true/false, discount info"

  /tenants:
    get:
      tags: [Tenants]
      summary: "Tenantlar ro'yxati (foydalanuvchiga ruxsat etilgan)"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenantlar va active_tenant_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tenant"
                  active_tenant_id:
                    type: integer

    post:
      tags: [Tenants]
      summary: Yangi tenant (do'kon) qo'shish
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category_id, region_id, district_id, street_id]
              properties:
                name:
                  type: string
                category_id:
                  type: integer
                region_id:
                  type: integer
                district_id:
                  type: integer
                street_id:
                  type: integer
      responses:
        "201":
          description: Tenant yaratildi
        "422":
          description: "Basic ta'rifda faqat bitta do'kon mumkin"

  /tenants/active:
    put:
      tags: [Tenants]
      summary: Active tenantni o'zgartirish
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: integer
      responses:
        "200":
          description: Active tenant tanlandi
        "403":
          description: Ruxsat yo'q

  /tenants/{tenant}:
    put:
      tags: [Tenants]
      summary: Do'konni tahrirlash (faqat owner o'z do'konini)
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
            description: Tenant (do'kon) ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Barcha maydonlar ixtiyoriy (faiz o'zgartirilayotganlarini yuboring)
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Do'kon nomi
                category_id:
                  type: integer
                  description: categories jadvalidan ID
                region_id:
                  type: integer
                  description: regions jadvalidan ID
                district_id:
                  type: integer
                  description: districts jadvalidan ID
                street_id:
                  type: integer
                  nullable: true
                  description: streets jadvalidan ID yoki null
      responses:
        "200":
          description: Do'kon yangilandi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Do'kon yangilandi."
                  tenant:
                    allOf:
                      - $ref: "#/components/schemas/Tenant"
                      - type: object
                        properties:
                          region:
                            type: object
                            properties:
                              id: { type: integer }
                              name: { type: string }
                          district:
                            type: object
                            properties:
                              id: { type: integer }
                              name: { type: string }
                          street:
                            type: object
                            nullable: true
                            properties:
                              id: { type: integer }
                              name: { type: string }
                          category:
                            type: object
                            properties:
                              id: { type: integer }
                              name: { type: string }
        "403":
          description: "Bu do'konni tahrirlash huquqingiz yo'q yoki obuna tugagan"
        "404":
          description: Tenant topilmadi
        "422":
          description: Validatsiya xatosi

    patch:
      tags: [Tenants]
      summary: Do'konni qisman yangilash (PUT bilan bir xil)
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                category_id: { type: integer }
                region_id: { type: integer }
                district_id: { type: integer }
                street_id: { type: integer, nullable: true }
      responses:
        "200":
          description: Do'kon yangilandi (PUT bilan bir xil javob)
        "403":
          description: Ruxsat yo'q yoki obuna tugagan
        "404":
          description: Tenant topilmadi
        "422":
          description: Validatsiya xatosi

    delete:
      tags: [Tenants]
      summary: Owner o'z do'konini o'chirish
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Do'kon va unga tegishli tenant ma'lumotlari o'chirildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  active_tenant_id:
                    type: integer
                    nullable: true
                  tenants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tenant"
        "403":
          description: Bu do'konni o'chirish huquqi yo'q
        "404":
          description: Tenant topilmadi

  /customers:
    get:
      tags: [Customers]
      summary: Mijozlar ro'yxati
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PageParam"
      responses:
        "200":
          description: Mijozlar ro'yxati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"
        "403":
          description: Trial tugagan

    post:
      tags: [Customers]
      summary: Mijoz yaratish
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, name, phone]
              properties:
                tenant_id:
                  type: integer
                name:
                  type: string
                phone:
                  type: string
                address:
                  type: string
      responses:
        "201":
          description: Mijoz yaratildi

  /customers/{id}:
    get:
      tags: [Customers]
      summary: Bitta mijoz
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Mijoz ma'lumotlari

    put:
      tags: [Customers]
      summary: Mijozni yangilash
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                address:
                  type: string
      responses:
        "200":
          description: Yangilandi

    delete:
      tags: [Customers]
      summary: Mijozni o'chirish
      security:
