    <!-- Telegram WebApp SDK (normal browserlarda ham xatolik bermaydi) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.expand();
      }
    </script>
    <!-- Telegram web-login auto-check (Web flow uchun) -->
    <script>
      (function () {
        try {
          var loc = window.location;
          // Faqat Telegram web-login sahifasi uchun ishlaydi
          if (!loc.pathname.startsWith("/telegram/web-login")) return;

          var params = new URLSearchParams(loc.search);
          var phone = params.get("phone");
          if (!phone) return;

          // Backend orqali tekshiruv
          fetch("https://web.daftaron.uz/telegram/web-login?phone=" + encodeURIComponent(phone), {
            credentials: "include"
          })
            .then(function (res) {
              if (!res.ok) return null;
              return res.json().catch(function () {
                return null;
              });
            })
            .then(function (data) {
              if (!data) return;

              // Agar backend token yuborsa – darhol login qilib yuboramiz
              var token = data.token || data.access_token;
              if (token) {
                try {
                  localStorage.setItem("token", token);
                  if (data.user) {
                    localStorage.setItem("user", JSON.stringify(data.user));
                  }
                } catch (e) {
                  console.error("LocalStorage xatolik:", e);
                }
                window.location.href = "/";
              }
            })
            .catch(function (err) {
              console.error("Telegram web-login tekshiruv xatolik:", err);
            });
        } catch (e) {
          console.error("Telegram web-login skript xatolik:", e);
        }
      })();
    </script>
