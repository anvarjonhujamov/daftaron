  <!-- Telegram WebApp SDK faqat Telegram ichida ochilganda, async yuklanadi (oddiy brauzerda sahifani bloklamaydi) -->
  <script>
    (function () {
      var inTelegram = /tgWebApp/.test(window.location.hash) || !!window.TelegramWebviewProxy || window.parent !== window;
      try { inTelegram = inTelegram || !!sessionStorage.getItem('__telegram__initParams'); } catch (e) {}
      if (!inTelegram) return;
      var s = document.createElement('script');
      s.src = 'https://telegram.org/js/telegram-web-app.js';
      s.async = true;
      s.onload = function () { window.dispatchEvent(new Event('telegram-sdk-loaded')); };
      document.head.appendChild(s);
    })();
  </script>
  <!-- Telegram web-login auto-check (Web flow uchun) -->
  <script>
    (function () {
      try {
        var loc = window.location;
        // Faqat Telegram web-login sahifasi uchun ishlaydi
        if (!loc.pathname.startsWith("/telegram/web-login")) return;

        var params = new URLSearchParams(loc.search);
        var phone = params.get("phone");
        if (!phone) return;

        // Backend orqali tekshiruv
        fetch("https://web.daftaron.uz/telegram/web-login?phone=" + encodeURIComponent(phone), {
          credentials: "include"
        })
          .then(function (res) {
            if (!res.ok) return null;
            return res.json().catch(function () {
              return null;
            });
          })
          .then(function (data) {
            if (!data) return;

            // Agar backend token yuborsa – darhol login qilib yuboramiz
            var token = data.token || data.access_token;
            if (token) {
              try {
                localStorage.setItem("token", token);
                if (data.user) {
                  localStorage.setItem("user", JSON.stringify(data.user));
                }
              } catch (e) {
                console.error("LocalStorage xatolik:", e);
              }
              window.location.href = "/";
            }
          })
          .catch(function (err) {
            console.error("Telegram web-login tekshiruv xatolik:", err);
          });
      } catch (e) {
        console.error("Telegram web-login skript xatolik:", e);
      }
    })();
  </script>
